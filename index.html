<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAEJIN STUDY RANKING</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="top">
        <div>
          <p class="eyebrow">DAEJIN STUDY · LIVE RANKING</p>
          <h1>DAEJIN STUDY RANKING</h1>
          <p class="hero-copy">오자·야자·심자 미참여 기록을 실시간으로 확인하세요.</p>
        </div>
        <nav aria-label="주요 메뉴"><a href="#ranking">학교 랭킹</a><a href="#admin-login">개인 조회</a><a href="#history">최근 기록</a></nav>
        <div class="season-panel">
          <span>Season 2026</span>
          <strong id="active-count">0명 생존</strong>
        </div>
      </header>

      <main class="layout">
        <section class="ranking-stage" id="ranking" aria-label="벌점 랭킹">
          <div class="rift-visual" aria-hidden="true">
            <div class="champion champion-left">
              <span class="blade"></span>
              <span class="helmet"></span>
            </div>
            <div class="rift-lane"></div>
            <div class="champion champion-right">
              <span class="staff"></span>
              <span class="helmet"></span>
            </div>
          </div>
          <div class="champion-select" id="champion-select" aria-label="챔피언 컨셉"></div>
          <div class="stage-header">
            <div>
              <p class="eyebrow">SCHOOL RANKING</p>
              <h2>학교 전체 랭킹</h2>
            </div>
            <form class="finder-form" id="finder-form">
              <input id="finder-name" type="search" autocomplete="off" placeholder="이름 또는 반·번호 검색" />
              <button class="ghost-button" type="submit">내 순위 찾기</button>
            </form>
          </div>

          <div class="my-rank-card" id="my-rank-card"></div>
          <div class="leader-card" id="leader-card"></div>
          <ol class="ranking-list" id="ranking-list"></ol>
        </section>

        <aside class="control-panel" aria-label="벌점 관리">
          <section class="panel-block admin-login" id="admin-login">
            <div class="panel-title">
              <span class="mini-crest calm"></span>
              <h2>관리자 입장</h2>
            </div>
            <form id="admin-form" class="student-form">
              <label>
                비밀번호
                <input id="admin-password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" />
              </label>
              <button type="submit">관리자 모드</button>
              <p class="login-message" id="login-message"></p>
            </form>
          </section>

          <div class="admin-tools" id="admin-tools" hidden>
          <section class="panel-block admin-status">
            <div>
              <p class="eyebrow">Admin Mode</p>
              <strong>벌점 기록 권한 활성화</strong>
            </div>
            <button class="ghost-button" id="admin-logout" type="button">나가기</button>
          </section>

          <section class="panel-block">
            <div class="panel-title">
              <span class="mini-crest"></span>
              <h2>소환사 등록</h2>
            </div>
            <form id="student-form" class="student-form">
              <label>
                이름
                <input id="student-name" type="text" autocomplete="off" placeholder="예: 김민준" required />
              </label>
              <label>
                학번/반
                <input id="student-class" type="text" autocomplete="off" placeholder="예: 2-3" />
              </label>
              <button type="submit">등록</button>
            </form>
          </section>

          <section class="panel-block">
            <div class="panel-title">
              <span class="mini-crest danger"></span>
              <h2>벌점 기록</h2>
            </div>
            <form id="penalty-form" class="penalty-form">
              <label>
                대상
                <select id="penalty-student"></select>
              </label>
              <div class="quick-points" role="group" aria-label="벌점 선택">
                <button type="button" data-points="1">+1</button>
                <button type="button" data-points="2">+2</button>
                <button type="button" data-points="3">+3</button>
                <button type="button" data-points="-1">-1</button>
              </div>
              <label>
                사유
                <select id="penalty-reason">
                  <option>오자 신청 후 미참석</option>
                  <option>야자 신청 후 미참석</option>
                  <option>심자 신청 후 무단이탈</option>
                  <option>무단 이탈</option>
                  <option>반복 지각</option>
                </select>
              </label>
              <button type="submit">기록 저장</button>
            </form>
          </section>

          <section class="panel-block">
            <div class="panel-title">
              <span class="mini-crest calm"></span>
              <h2>강등 기준</h2>
            </div>
            <div class="tier-guide" id="tier-guide"></div>
          </section>
          </div>
        </aside>
      </main>

      <section class="history-band" id="history" aria-label="최근 기록">
        <div class="history-header">
          <div>
            <p class="eyebrow">RECENT HISTORY</p>
            <h2>최근 기록</h2>
          </div>
          <div class="admin-actions" id="admin-actions" hidden>
            <button class="ghost-button" id="reset-roster" type="button" title="2학년 기본 명단으로 되돌리기">
              명단 초기화
            </button>
            <button class="ghost-button" id="clear-history" type="button" title="기록만 비우기">로그 비우기</button>
          </div>
        </div>
        <ul class="history-list" id="history-list"></ul>
      </section>
    </div>

    <template id="crest-template">
      <svg viewBox="0 0 120 132" aria-hidden="true">
        <path class="crest-shadow" d="M60 4 73 18 104 12 93 39 111 58 91 70 84 103 60 126 36 103 29 70 9 58 27 39 16 12 47 18 60 4Z" />
        <path class="crest-wing left" d="M53 25 24 19 35 43 15 58 36 64 39 91 52 73Z" />
        <path class="crest-wing right" d="M67 25 96 19 85 43 105 58 84 64 81 91 68 73Z" />
        <path class="crest-main" d="M60 13 82 32 77 82 60 114 43 82 38 32 60 13Z" />
        <path class="crest-glow" d="M60 25 72 38 69 75 60 94 51 75 48 38 60 25Z" />
        <path class="crest-cut" d="M60 31 67 43 63 72 60 83 57 72 53 43 60 31Z" />
        <path class="crest-crown" d="M44 29 60 9 76 29 66 25 60 33 54 25 44 29Z" />
      </svg>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
